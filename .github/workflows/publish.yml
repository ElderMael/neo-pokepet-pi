name: Publish to NPM

on:
  push:
    branches: [main]
    # Only publish when files that ship in the npm tarball change.
    # demo.png is served to the pi.dev gallery directly from GitHub raw
    # via pi.image, so image-only changes do not need an npm release.
    paths:
      - package.json
      - package-lock.json
      - extensions/**
      - scripts/cli.js
      - README.md
      - LICENSE
      - CHANGELOG.md

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check
        run: npm run lint

      - name: Publish to NPM via OIDC trusted publishing
        run: npm publish --provenance
