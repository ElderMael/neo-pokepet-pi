name: Publish to NPM

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    environment: pokepet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check
        run: npm run lint

      - name: Check NPM_TOKEN presence
        run: |
          if [ -z "${NPM_TOKEN+x}" ]; then
            echo "NPM_TOKEN is UNSET in the job environment"
          else
            echo "NPM_TOKEN is set, length ${#NPM_TOKEN}"
          fi
          echo "--- all env var names ---"
          env | cut -d= -f1 | sort

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Publish to NPM
        run: npm publish --provenance
